<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tali map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<style>
  :root { --red:#E5392B; --ink:#1a1a1a; --paper:#f7f6f3; --muted:#888; --line:#e0dedd; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; font-family:'IBM Plex Mono',monospace; background:var(--paper); -webkit-font-smoothing:antialiased; }
  #app { display:flex; flex-direction:column; height:100vh; }
  #header { padding:16px 24px 12px; border-bottom:1px solid var(--line); background:var(--paper); display:flex; align-items:baseline; gap:14px; flex-shrink:0; z-index:500; }
  #header h1 { font-family:'Fraunces',serif; font-weight:500; font-size:20px; letter-spacing:-0.02em; }
  #header p { font-size:11px; color:var(--muted); }
  #map-wrap { position:relative; flex:1; }
  #map { width:100%; height:100%; }

  /* loading */
  #loading { position:absolute; inset:0; z-index:2000; background:var(--paper); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; transition:opacity 0.4s; }
  #loading.hidden { opacity:0; pointer-events:none; }
  #loading p { font-size:11px; color:var(--muted); letter-spacing:0.1em; }
  .spinner { width:28px; height:28px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--red); animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* filters */
  #filters { position:absolute; top:16px; left:16px; z-index:1000; width:220px; border-radius:14px; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,0.16); font-family:'IBM Plex Mono',monospace; }
  .f-header { background:var(--ink); color:white; padding:12px 16px; display:flex; align-items:center; gap:8px; }
  .f-header span { font-size:11px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; }
  .f-header svg { width:16px; height:16px; stroke:white; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .f-body { background:white; padding:6px 0; }
  .f-row { display:flex; align-items:center; padding:8px 14px; gap:10px; cursor:pointer; user-select:none; }
  .f-row:hover { background:#fafafa; }
  .f-icon { width:30px; height:30px; border-radius:50%; background:var(--red); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .f-icon svg { width:14px; height:14px; stroke:white; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .f-name { flex:1; font-size:12px; font-weight:500; color:var(--ink); }
  .toggle { width:36px; height:20px; border-radius:10px; background:var(--ink); position:relative; flex-shrink:0; transition:background 0.2s; }
  .toggle::after { content:''; position:absolute; width:14px; height:14px; border-radius:50%; background:white; top:3px; right:3px; transition:transform 0.2s; }
  .toggle.off { background:#ccc; }
  .toggle.off::after { transform:translateX(-16px); }

  /* pins */
  .leaflet-div-icon { background:none !important; border:none !important; }
  .tpin { width:32px; height:32px; background:var(--red); border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 6px -1px rgba(0,0,0,0.5); border:2px solid white; }
  .tpin-i { transform:rotate(45deg); display:flex; align-items:center; justify-content:center; }
  .tpin-i svg { width:16px; height:16px; stroke:white; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }

  /* cluster */
  .tcluster { background:white; color:var(--red); width:40px !important; height:40px !important; border-radius:50%; border:2px solid var(--red); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-weight:bold; font-size:14px; box-shadow:0 4px 10px rgba(0,0,0,0.25); margin-left:-20px !important; margin-top:-20px !important; }

  /* popup */
  .leaflet-popup-content-wrapper { padding:0 !important; border-radius:14px !important; box-shadow:0 8px 32px rgba(0,0,0,0.16) !important; overflow:hidden; font-family:'IBM Plex Mono',monospace !important; }
  .leaflet-popup-content { margin:0 !important; width:260px !important; }
  .leaflet-popup-tip-container { display:none; }
  .leaflet-popup-close-button { display:none !important; }
  .pop-header { padding:14px 14px 10px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; gap:10px; position:relative; }
  .pop-icon { width:32px; height:32px; border-radius:50%; background:var(--red); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .pop-icon svg { width:15px; height:15px; stroke:white; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .pop-name { font-family:'Fraunces',serif; font-weight:600; font-size:16px; line-height:1.2; }
  .pop-tag { font-size:8px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-top:3px; }
  .pop-x { position:absolute; top:12px; right:12px; font-size:18px; color:#ccc; cursor:pointer; line-height:1; padding:2px 4px; }
  .pop-x:hover { color:var(--ink); }
  .pop-body { padding:12px 14px 14px; }
  .pop-why { font-size:11px; line-height:1.7; color:#444; margin-bottom:10px; }
  .pop-maps { display:inline-flex; align-items:center; gap:4px; font-size:10px; color:var(--red); text-decoration:none; }
  .pop-maps:hover { opacity:0.75; }
  .pop-maps svg { width:11px; height:11px; stroke:var(--red); fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>tali map</h1>
    <p>places that have brought me joy</p>
  </div>
  <div id="map-wrap">
    <div id="loading">
      <div class="spinner"></div>
      <p>loading places...</p>
    </div>
    <div id="map"></div>
    <div id="filters">
      <div class="f-header">
        <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        <span>Map Filters</span>
      </div>
      <div class="f-body">
        <div class="f-row" onclick="toggleFilter('museum')">
          <div class="f-icon"><svg viewBox="0 0 24 24"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg></div>
          <span class="f-name">Museums</span><div class="toggle" id="t-museum"></div>
        </div>
        <div class="f-row" onclick="toggleFilter('dancing')">
          <div class="f-icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
          <span class="f-name">Dancing</span><div class="toggle" id="t-dancing"></div>
        </div>
        <div class="f-row" onclick="toggleFilter('nature')">
          <div class="f-icon"><svg viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></div>
          <span class="f-name">Nature</span><div class="toggle" id="t-nature"></div>
        </div>
        <div class="f-row" onclick="toggleFilter('food')">
          <div class="f-icon"><svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></div>
          <span class="f-name">Food</span><div class="toggle" id="t-food"></div>
        </div>
        <div class="f-row" onclick="toggleFilter('coffee')">
          <div class="f-icon"><svg viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg></div>
          <span class="f-name">Coffee</span><div class="toggle" id="t-coffee"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const ICONS = {
  coffee:`<svg viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>`,
  food:`<svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>`,
  dancing:`<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
  museum:`<svg viewBox="0 0 24 24"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>`,
  surf:`<svg viewBox="0 0 24 24"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>`,
  hike:`<svg viewBox="0 0 24 24"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>`,
  ski:`<svg viewBox="0 0 24 24"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/><path d="M4.14 15.08c2.62-1.57 5.24-1.43 7.86.42 2.74 1.94 5.49 2 8.23.19"/></svg>`,
  park:`<svg viewBox="0 0 24 24"><path d="M17 14c.83-1.333 1-2.165 1-3a6 6 0 0 0-12 0c0 .835.17 1.667 1 3l4 7 4-7Z"/><path d="M9.17 14a6 6 0 0 1 5.66 0"/></svg>`,
  'motorbike loop':`<svg viewBox="0 0 24 24"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>`,
};

function getIcon(cat,subtag){return ICONS[subtag]||ICONS[cat]||ICONS.food;}
function pinIcon(cat,subtag){return L.divIcon({className:'',html:`<div class="tpin"><div class="tpin-i">${getIcon(cat,subtag)}</div></div>`,iconSize:[32,32],iconAnchor:[8,32],popupAnchor:[8,-34]});}
function popupHtml(p){
  const icon=getIcon(p.category,p.subtag);
  const tag=[p.category,p.subtag].filter(Boolean).join(' · ');
  const mapsUrl=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' '+p.city)}`;
  const mapsLink=p.hasMaps?`<a class="pop-maps" href="${mapsUrl}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>View on Google Maps →</a>`:'';
  return `<div class="pop-header"><div class="pop-icon">${icon}</div><div><div class="pop-name">${p.name}</div><div class="pop-tag">${tag}</div></div><span class="pop-x">×</span></div><div class="pop-body"><div class="pop-why">${p.why}</div>${mapsLink}</div>`;
}

const map=L.map('map',{zoomControl:false}).setView([20,10],2);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
  subdomains:'abcd',maxZoom:19
}).addTo(map);

const layers={};
const active={museum:true,dancing:true,nature:true,food:true,coffee:true};
function mkGroup(){return L.markerClusterGroup({iconCreateFunction:c=>L.divIcon({html:`<div class="tcluster">${c.getChildCount()}</div>`,className:'',iconSize:[40,40]}),maxClusterRadius:50,showCoverageOnHover:false,zoomToBoundsOnClick:true,spiderfyOnMaxZoom:true});}
['museum','dancing','nature','food','coffee'].forEach(cat=>{layers[cat]=mkGroup();map.addLayer(layers[cat]);});

async function loadPins(){
  try {
    const res=await fetch('/api/pins');
    if(!res.ok) throw new Error('fetch failed');
    const {pins}=await res.json();
    pins.forEach(p=>{
      const m=L.marker([p.lat,p.lng],{icon:pinIcon(p.category,p.subtag)});
      m.bindPopup(popupHtml(p),{maxWidth:260,minWidth:260});
      layers[p.category]?.addLayer(m);
    });
    document.getElementById('loading').classList.add('hidden');
  } catch(e) {
    document.getElementById('loading').innerHTML='<p style="color:#888;font-size:11px">couldn\'t load pins</p>';
    console.error(e);
  }
}
loadPins();

function toggleFilter(cat){
  active[cat]=!active[cat];
  const t=document.getElementById('t-'+cat);
  if(active[cat]){map.addLayer(layers[cat]);t.classList.remove('off');}
  else{map.removeLayer(layers[cat]);t.classList.add('off');}
}
document.addEventListener('click',e=>{if(e.target.classList.contains('pop-x'))map.closePopup();});
</script>
</body>
</html>
